name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API integration tests deploy the real contract on anvil, so they need Foundry
      # and the contract build artifacts.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: pnpm lint
      - run: pnpm typecheck
      # Contract tests run in the "contracts" job.
      - run: pnpm -r --if-present --filter '!contracts' test
      - run: pnpm --filter web build
      - run: pnpm audit --audit-level high
        continue-on-error: true

  contracts:
    name: Foundry build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
        working-directory: contracts
      # Fork tests need the QIE mainnet RPC and are run by hand, not in CI.
      - run: forge test -vvv --no-match-path 'test/fork/*'
        working-directory: contracts

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
