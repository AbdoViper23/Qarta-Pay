[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.24"
# QIE runs at Shanghai level (PUSH0 works, Cancun opcodes do not). Contracts already
# on mainnet use berlin/paris, so we stay on paris. See docs/probe-results.md §1.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
