<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: B;
        font-weight: 800;
        src: url('../fonts/BarlowCondensed-ExtraBold.ttf');
      }
      @font-face {
        font-family: M;
        src: url('../fonts/IBMPlexMono-Regular.ttf');
      }
      @font-face {
        font-family: M;
        font-weight: 600;
        src: url('../fonts/IBMPlexMono-SemiBold.ttf');
      }
      body {
        margin: 0;
        width: 2000px;
        background: #ecebe6;
        color: #141414;
        font-family: M;
      }
      header {
        padding: 40px 50px 10px;
        display: flex;
        justify-content: space-between;
        align-items: end;
      }
      h1 {
        font-family: B;
        font-size: 72px;
        margin: 0;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 30px 50px 50px;
      }
      .f img {
        width: 100%;
        border: 3px solid #141414;
        display: block;
      }
      .t {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        font-size: 22px;
        margin-top: 12px;
      }
      .t span:last-child {
        color: #d9381e;
      }
      .v {
        font-size: 18px;
        line-height: 1.5;
        color: #5b5a56;
        margin-top: 6px;
      }
      .who {
        display: inline-block;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        padding: 3px 8px;
        margin-top: 8px;
        border: 2px solid #141414;
      }
      .rec {
        background: #d9381e;
        border-color: #d9381e;
        color: #fbfaf7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Qarta Pay — demo storyboard</h1>
      <span style="font-size: 22px">2:30 · English VO · docs/17-DEMO-SCRIPT.md</span>
    </header>
    <div class="grid" id="g"></div>
    <script>
      const F = [
        [
          1,
          'Intro',
          '0:00–0:10',
          '“This is Qarta Pay. It lets you spend QIE on real life…”',
          'ANIMATED',
        ],
        [
          2,
          'Problem',
          '0:10–0:25',
          '“…most crypto gift card shops ask you to pay first and trust them.”',
          'ANIMATED',
        ],
        [
          3,
          'How it works',
          '0:25–0:45',
          '“Your payment goes into an escrow contract on QIE Mainnet…”',
          'ANIMATED',
        ],
        [
          4,
          'Walkthrough 4a–4f',
          '0:45–2:00',
          'Connect QIE Wallet → choose → price → pay → progress → SMS + explorer. Placeholder frame.',
          'TEAM SCREEN RECORDING',
        ],
        [
          5,
          'Built on QIE',
          '2:00–2:15',
          '“QIE Wallet, QIE and QUSDC, QIE ID, QIEDEX and the QIE oracle…”',
          'ANIMATED + 3 S RECORDING',
        ],
        [
          6,
          'Roadmap + outro',
          '2:15–2:30',
          '“Next come data bundles, sending to a .qie name, bill payments…”',
          'ANIMATED',
        ],
      ];
      document.getElementById('g').innerHTML = F.map(
        ([n, t, time, v, w]) => `<div class="f"><img src="scene-${n}.png">
<div class="t"><span>${n} · ${t}</span><span>${time}</span></div><div class="v">${v}</div>
<span class="who ${w.startsWith('TEAM') ? 'rec' : ''}">${w}</span></div>`,
      ).join('');
    </script>
  </body>
</html>
